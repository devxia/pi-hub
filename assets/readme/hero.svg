<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-labelledby="title desc">
  <title id="title">Pi Hub — 在桌面整理会话，在终端继续工作</title>
  <desc id="desc">冷灰与蓝色的 Pi Hub 标题。右侧的选中会话连接到 Terminal 和 Ghostty，表达桌面管理与外部终端继续原生 Pi 会话的关系；真实应用截图紧随其后。</desc>
  <rect width="1200" height="376" rx="12" fill="#f3f6f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="identity" transform="translate(56 46)">
      <rect width="36" height="36" rx="7" fill="#285ab0"/>
      <path d="m10 11 6 7-6 7m10 0h7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="25" font-size="20" fill="#52636d" letter-spacing="1.5">PI 的 macOS 会话工作台</text>
      <text x="-3" y="139" font-size="90" font-weight="650" letter-spacing="-5" fill="#26343a">Pi Hub</text>
      <text x="0" y="206" font-size="32" font-weight="550" fill="#26343a">在桌面整理会话，</text>
      <text x="0" y="251" font-size="32" font-weight="550" fill="#285ab0">在终端继续工作。</text>
      <text x="0" y="293" font-size="18" fill="#64747f">原生 Pi 记录 · Terminal / Ghostty</text>
    </g>
    <g id="session-to-terminal" transform="translate(680 51)">
      <rect x="0" y="0" width="464" height="164" rx="8" fill="#fff" stroke="#e2e8eb"/>
      <text x="24" y="37" font-size="19" fill="#64747f">会话</text>
      <text x="440" y="37" text-anchor="end" font-size="18" fill="#64747f">项目</text>
      <path d="M0 55h464" stroke="#e2e8eb"/>
      <rect x="12" y="65" width="440" height="50" rx="5" fill="#eaf0fa"/>
      <rect x="12" y="65" width="3" height="50" rx="1.5" fill="#285ab0"/>
      <text x="27" y="97" font-size="22" font-weight="550" fill="#234f96">找回上下文，继续这一轮</text>
      <text x="437" y="97" font-size="19" text-anchor="end" fill="#52636d">Pi Hub</text>
      <circle cx="30" cy="140" r="3" fill="#64747f"/>
      <text x="42" y="146" font-size="18" fill="#64747f">只读预览</text>
      <text x="437" y="146" text-anchor="end" font-size="18" fill="#64747f">原生会话</text>
      <path d="M232 164v35" fill="none" stroke="#285ab0" stroke-width="2"/>
      <path d="m226 193 6 6 6-6" fill="none" stroke="#285ab0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="211" width="464" height="100" rx="8" fill="#26343a"/>
      <path d="m26 240 9 9-9 9m18 0h15" fill="none" stroke="#a0c1ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="77" y="256" font-size="25" font-weight="550" fill="#fff">Terminal / Ghostty</text>
      <text x="26" y="289" font-size="19" fill="#c3d0d8">Hub 退出，外部 Pi 继续运行。</text>
    </g>
  </g>
</svg>
