<svg xmlns="http://www.w3.org/2000/svg" width="600" height="612" viewBox="0 0 600 612" role="img" aria-labelledby="title desc">
  <title id="title">添加项目，整理会话，在终端继续</title>
  <desc id="desc">选择项目和需要管理的历史，搜索预览并整理分类，再到 Terminal 或 Ghostty 打开原会话。原生 Pi 记录保留。</desc>
  <rect width="600" height="612" rx="10" fill="#f7f9fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="project" transform="translate(38 42)">
      <text y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#285ab0">01</text>
      <text x="70" y="37" font-size="38" font-weight="600" fill="#26343a">添加项目</text>
      <text x="70" y="83" font-size="28" fill="#52636d">选择目录与历史</text>
    </g>
    <path d="M57 149v29m-6-6 6 6 6-6" fill="none" stroke="#99afbe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="organize" transform="translate(38 201)">
      <text y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#285ab0">02</text>
      <text x="70" y="37" font-size="38" font-weight="600" fill="#26343a">整理会话</text>
      <text x="70" y="83" font-size="28" fill="#52636d">搜索、预览、归档</text>
    </g>
    <path d="M57 308v29m-6-6 6 6 6-6" fill="none" stroke="#99afbe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="continue" transform="translate(38 360)">
      <text y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#285ab0">03</text>
      <text x="70" y="37" font-size="38" font-weight="600" fill="#26343a">终端继续</text>
      <text x="70" y="83" font-size="28" fill="#52636d">Terminal / Ghostty</text>
    </g>
    <path d="M38 486h524" stroke="#e2e8eb"/>
    <text x="38" y="536" font-size="28" fill="#52636d">一份原生 Pi 记录，</text>
    <text x="38" y="579" font-size="28" fill="#52636d">连接桌面管理与终端工作。</text>
  </g>
</svg>
